<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Form entries · BPO Hive admin</title>
<link rel="icon" href="/assets/logo/apple-touch-icon.png">
<style>
@font-face{font-family:Inter;src:url(/assets/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"DM Sans";src:url(/assets/fonts/dm-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{--navy:#081521;--ink:#0d1d2b;--muted:#5d7280;--line:#dbe8f0;--soft:#f5f9fc;--blue:#0f7ac4}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 Inter,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;height:64px;padding:0 24px;background:var(--navy);color:#fff}
.top img{height:30px;display:block}
.top nav{display:flex;gap:6px;margin-left:12px}
.top nav a{padding:8px 12px;border-radius:6px;color:#c7d6df;text-decoration:none;font-weight:600}
.top nav a:hover,.top nav a.on{background:rgba(255,255,255,.1);color:#fff}
.top .out{margin-left:auto;padding:8px 14px;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:none;color:#fff;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
h1{margin:0 0 4px;font-family:"DM Sans",Inter,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.03em}
.sub{margin:0 0 22px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
.tab.on{border-color:var(--blue);background:var(--blue);color:#fff}
.tab b{margin-left:6px;padding:1px 7px;border-radius:10px;background:rgba(0,0,0,.08);font-size:12px}
.tab.on b{background:rgba(255,255,255,.2)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.bar input,.bar select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.bar input{flex:1;min-width:220px}
.bar button{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;cursor:pointer}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:11px 14px;border-bottom:1px solid #edf3f7;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tbody tr{cursor:pointer}tbody tr:hover{background:#f7fbfe}
td small{display:block;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;background:#e8f3fb;color:#0f6fae;font-size:12px;font-weight:700;white-space:nowrap}
.empty{padding:50px;text-align:center;color:var(--muted)}
.login{max-width:380px;margin:12vh auto;padding:32px;border:1px solid var(--line);border-radius:12px;background:#fff}
.login img{height:34px;margin-bottom:18px}
.login label{display:grid;gap:6px;font-size:13px;font-weight:600;color:#344d5c}
.login input{height:46px;padding:0 12px;border:1px solid var(--line);border-radius:6px}
.login button{width:100%;height:48px;margin-top:16px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.err{min-height:20px;margin:10px 0 0;color:#c0392b;font-size:14px}
dialog{width:min(640px,calc(100% - 28px));padding:0;border:0;border-radius:12px;box-shadow:0 30px 80px rgba(8,21,33,.35)}
dialog::backdrop{background:rgba(8,21,33,.5)}
.dl{padding:26px}.dl h2{margin:0 0 4px;font-family:"DM Sans",Inter,sans-serif;font-size:22px}
.dl dl{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;margin:18px 0 0}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}.dl dd{margin:0;word-break:break-word}
.dl-del{margin-top:22px;padding:10px 16px;border:1px solid #f1c7c2;border-radius:6px;background:#fff;color:#c0392b;font-weight:600;cursor:pointer}.dl-del:hover{background:#fdf1ef}
.dl .x{float:right;width:34px;height:34px;border:0;border-radius:50%;background:#f1f5f8;cursor:pointer;font-size:18px}
[hidden]{display:none!important}
@media(max-width:640px){.top nav{display:none}.dl dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <img src="/assets/logo/bpohivelogo.png" alt="BPO Hive">
  <form id="login-form">
    <label>Admin password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Sign in</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <img src="/assets/logo/bpohivelogo-white.png" alt="BPO Hive">
    <nav><a href="/admin/" >Content</a><a class="on" href="/admin/entries.html">Form entries</a></nav>
    <button class="out" id="logout" type="button">Sign out</button>
  </header>
  <main>
    <h1>Form entries</h1>
    <p class="sub">Every form sent from the website, plus forms people started but never sent.</p>
    <div class="tabs">
      <button class="tab on" data-view="entries" type="button">Form entries <b id="n-entries">0</b></button>
      <button class="tab" data-view="abandoned" type="button">Abandoned forms <b id="n-abandoned">0</b></button>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search name, email, company, phone">
      <select id="form-filter"><option value="">All forms</option></select>
      <button id="csv" type="button">Download CSV</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div class="card"><table><thead><tr><th>Date</th><th>Form</th><th>Name</th><th>Email</th><th>Company</th><th>Phone</th><th>Budget</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>Nothing here yet.</div></div>
  </main>
</div>

<dialog id="detail"><div class="dl"><button class="x" type="button" aria-label="Close">×</button><h2 id="d-title"></h2><div id="d-sub" style="color:#5d7280"></div><dl id="d-body"></dl><button class="dl-del" id="d-del" type="button">Delete this entry</button></div></dialog>

<script>
(function(){
  var data={entries:[],abandoned:[]},view='entries';
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  function pick(f,keys){for(var i=0;i<keys.length;i++){if(f[keys[i]])return f[keys[i]]}return ''}
  function nameOf(f){return pick(f,['name','fullName'])||[pick(f,['firstName','first_name','first-name','fname']),pick(f,['lastName','last_name','last-name','lname'])].join(' ').trim()}
  function when(r){return new Date(r.at||r.updated||r.first)}
  function fmt(d){return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
  function rowsFor(){
    var q=$('q').value.trim().toLowerCase(),ff=$('form-filter').value;
    return data[view].filter(function(r){return(!ff||r.form===ff)&&(!q||JSON.stringify(r.fields).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return when(b)-when(a)});
  }
  function render(){
    var list=rowsFor(),forms={};
    data[view].forEach(function(r){forms[r.form]=1});
    var sel=$('form-filter'),cur=sel.value;
    sel.innerHTML='<option value="">All forms</option>'+Object.keys(forms).sort().map(function(f){return'<option'+(f===cur?' selected':'')+'>'+esc(f)+'</option>'}).join('');
    $('rows').innerHTML=list.map(function(r,i){var f=r.fields||{};return'<tr data-i="'+i+'"><td>'+esc(fmt(when(r)))+'</td><td><span class="pill">'+esc(r.form)+'</span></td><td>'+esc(nameOf(f))+'</td><td>'+esc(pick(f,['email','work_email','businessEmail']))+'</td><td>'+esc(pick(f,['company','companyName','company_name','website']))+'</td><td>'+esc(pick(f,['phone','phone_number','tel']))+'</td><td>'+esc(pick(f,['budget','monthly_budget']))+'</td></tr>'}).join('');
    $('empty').hidden=list.length>0;
    $('n-entries').textContent=data.entries.length;$('n-abandoned').textContent=data.abandoned.length;
    [].forEach.call($('rows').children,function(tr){tr.onclick=function(){show(list[+tr.dataset.i])}});
  }
  function show(r){
    var f=r.fields||{};
    $('d-title').textContent=nameOf(f)||pick(f,['email'])||'Entry';
    $('d-sub').textContent=r.form+' · '+fmt(when(r))+(view==='abandoned'?' · last typed':'');
    var extra={Page:r.page,Referrer:r.referrer};
    if(view==='abandoned'&&r.first)extra['Started']=fmt(new Date(r.first));
    $('d-body').innerHTML=Object.keys(f).map(function(k){return'<dt>'+esc(k)+'</dt><dd>'+esc(f[k])+'</dd>'}).join('')+Object.keys(extra).filter(function(k){return extra[k]}).map(function(k){return'<dt>'+k+'</dt><dd>'+esc(extra[k])+'</dd>'}).join('');
    $('d-del').onclick=function(){if(!r.id||!confirm('Delete this entry for good? This cannot be undone.'))return;fetch('/api/admin/entries?view='+view+'&id='+encodeURIComponent(r.id),{method:'DELETE',credentials:'same-origin'}).then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error(j.error||'Could not delete.');})}).then(function(){$('detail').close();data[view]=data[view].filter(function(y){return y!==r});render();}).catch(function(e){alert(e.message)})};
    $('detail').showModal();
  }
  function csv(){
    var list=rowsFor(),keys={};
    list.forEach(function(r){Object.keys(r.fields||{}).forEach(function(k){keys[k]=1})});
    var cols=Object.keys(keys),q=function(v){v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var lines=[['date','form'].concat(cols,['page']).map(q).join(',')].concat(list.map(function(r){return[when(r).toISOString(),r.form].concat(cols.map(function(k){return(r.fields||{})[k]}),[r.page]).map(q).join(',')}));
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='bpohive-'+view+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  }
  function load(){
    return Promise.all(['entries','abandoned'].map(function(v){return fetch('/api/admin/entries?view='+v,{credentials:'same-origin'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j}})})}))
    .then(function(res){
      if(res[0].status===401){$('app').hidden=true;$('login').hidden=false;return}
      $('login').hidden=true;$('app').hidden=false;
      if(!res[0].ok){$('empty').hidden=false;$('empty').textContent=res[0].j.error||'Could not load entries.';data={entries:[],abandoned:[]};render();$('empty').hidden=false;return}
      data.entries=res[0].j.rows||[];data.abandoned=res[1].ok?(res[1].j.rows||[]):[];render();
    });
  }
  $('login-form').onsubmit=function(e){e.preventDefault();$('login-err').textContent='';
    fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:this.password.value})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Sign in failed');})}).then(function(){$('login-form').reset();var nx=new URLSearchParams(location.search).get('next');if(nx&&/^\/admin\/?$/.test(nx)){location.replace('/admin/');return}load()}).catch(function(e){$('login-err').textContent=e.message})};
  $('logout').onclick=function(){fetch('/api/admin/login',{method:'DELETE',credentials:'same-origin'}).then(function(){location.reload()})};
  [].forEach.call(document.querySelectorAll('.tab'),function(t){t.onclick=function(){view=t.dataset.view;[].forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===t)});$('form-filter').value='';render()}});
  $('q').oninput=render;$('form-filter').onchange=render;$('csv').onclick=csv;$('refresh').onclick=load;
  document.querySelector('#detail .x').onclick=function(){$('detail').close()};
  load();
})();
</script>
</body>
</html>
