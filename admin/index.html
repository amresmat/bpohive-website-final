/* Lead pop-up: details and notes on the left, trail on the right */
dialog.pl-dialog{width:min(1240px,calc(100% - 28px))}
.pl-dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:26px;align-items:start;margin-top:4px}
.pl-dgrid>*{min-width:0}
.pl-dtrail{position:sticky;top:0;max-height:calc(100vh - 120px);overflow-y:auto;padding:4px 4px 4px 22px;border-left:1px solid var(--line)}
.pl-dtrail .pl-h{margin-top:16px}.pl-dtrail .pl-tl li{grid-template-columns:112px 1fr;gap:10px}
.pl-dmain .pl-table{overflow-x:auto}
@media(max-width:860px){.pl-hcard{grid-template-columns:1fr;gap:10px;padding:14px 16px}.pl-h-side{justify-items:start;text-align:left}.pl-h-act{justify-content:flex-start}
.pl-dgrid{grid-template-columns:1fr;gap:0}.pl-dtrail{position:static;max-height:none;overflow:visible;padding:0;border-left:0}.pl-dtrail .pl-tl li{grid-template-columns:1fr;gap:2px}}

<body>
<section class="login" id="login" hidden>
  <img src="/assets/logo/bpohivelogo.png" alt="BPO Hive">
  <form id="login-form">
    <label>Email <span class="lhint">(team members only, leave empty for the main admin)</span><input type="text" name="email" autocomplete="off" inputmode="email" spellcheck="false"></label>
    <label style="margin-top:12px">Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Sign in</button>
    <p class="lerr" id="login-err" role="alert"></p>
  </form>
  <form id="invite-form" hidden>
    <h2 class="lh2">Welcome<span id="inv-name"></span></h2>
    <p class="lsub">Choose a password for your BPO Hive Pipeline sign-in. Use at least 8 characters. Your email is <b id="inv-email"></b>.</p>
    <label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <label style="margin-top:12px">Repeat password<input type="password" name="password2" minlength="8" autocomplete="new-password" required></label>
    <button type="submit">Save and sign in</button>
    <p class="lerr" id="invite-err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <button class="btn menu" id="menu" type="button">Menu</button>
    <img src="/assets/logo/bpohivelogo-white.png" alt="BPO Hive">
    <span class="who" id="who" hidden></span>
    <button class="out" id="logout" type="button">Sign out</button>
  </header>
  <div class="wrap">
    <nav class="side" id="side"></nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="detail"><div class="dl"><button class="x" type="button" aria-label="Close">×</button><h2 id="d-title"></h2><div id="d-sub" style="color:#5d7280"></div><dl id="d-body"></dl><button class="btn del" id="d-del" type="button" style="margin-top:22px">Delete this entry</button></div></dialog>

<script src="/admin/insight.js"></script>
<script src="/admin/followup.js"></script>
<script src="/admin/pipeline.js"></script>
<script>
(function(){
var REPO='amresmat/bpohive-website-final',BRANCH='main',API='/api/gh/repos/'+REPO;
var CFG=null,SESSION={},$=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var main=$('main');

/* ---------- GitHub file helpers (through the website's server) ---------- */
function b64enc(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin)}
function b64dec(b){var bin=atob(b.replace(/\n/g,'')),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function gh(path,opt){opt=opt||{};return fetch(API+path,{method:opt.method||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'}).then(function(r){return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{}}catch(e){}if(r.status===401){showLogin();throw new Error('Please sign in again.')}if(r.status===409&&j.reconnect){SESSION.connected=false;needsGitHub();throw new Error(j.message)}if(!r.ok)throw new Error(j.message||('GitHub error '+r.status));return j})})}
function readFile(path){return gh('/contents/'+path+'?ref='+BRANCH).then(function(j){return{sha:j.sha,data:JSON.parse(b64dec(j.content))}})}
function writeFile(path,data,sha,message){return gh('/contents/'+path,{method:'PUT',body:{message:message,content:b64enc(JSON.stringify(data,null,2)+'\n'),sha:sha||undefined,branch:BRANCH}})}
function removeFile(path,sha,message){return gh('/contents/'+path,{method:'DELETE',body:{message:message,sha:sha,branch:BRANCH}})}
function listFolder(folder){return gh('/contents/'+folder+'?ref='+BRANCH).then(function(arr){return(arr||[]).filter(function(f){return f.type==='file'&&/\.json$/.test(f.name)})})}

/* ---------- Navigation ---------- */
function buildNav(){
  if(SESSION.role==='caller'){$('side').innerHTML='<h4>Leads</h4>'+(window.BH_PIPELINE?window.BH_PIPELINE.nav():'');return}
  var h='<h4>Leads</h4>'+(window.BH_PIPELINE?window.BH_PIPELINE.nav():'')+'<a href="#entries">Form entries</a>'+(window.BH_FOLLOWUP?'<a href="#followup">Follow-up emails</a>':'')+(window.BH_INSIGHT?window.BH_INSIGHT.nav():'')+'<h4>Content</h4>';
  CFG.collections.forEach(function(c){if(c.folder)h+='<a href="#c/'+c.name+'">'+esc(c.label)+'</a>'});
  CFG.collections.forEach(function(c){if(c.files){h+='<h4>'+esc(c.label)+'</h4>';c.files.forEach(function(f){h+='<a href="#f/'+c.name+'/'+f.name+'">'+esc(f.label||f.name)+'</a>'})}});
  h+='<h4>Website</h4><a href="/" target="_blank" rel="noopener">View live site ↗</a>';
  $('side').innerHTML=h;
}
function markNav(){var h=location.hash||'#entries';[].forEach.call($('side').querySelectorAll('a'),function(a){var href=a.getAttribute('href');a.classList.toggle('on',href===h||(href.length>1&&h.indexOf(href+'/')===0))});$('side').classList.remove('open')}
function route(){
  if(SESSION.role==='caller'&&(location.hash||'').indexOf('#pipeline')!==0){location.replace('#pipeline');}
  var h=(location.hash||(SESSION.role==='caller'?'#pipeline':'#entries')).slice(1).split('/');markNav();
  if(h[0]==='insight'&&window.BH_INSIGHT)return window.BH_INSIGHT.route(h.slice(1),main);
  if(h[0]==='followup'&&window.BH_FOLLOWUP)return window.BH_FOLLOWUP.view(main);
  if(h[0]==='pipeline'&&window.BH_PIPELINE)return window.BH_PIPELINE.route(h.slice(1),main);
  if(h[0]==='c'){var col=CFG.collections.find(function(c){return c.name===h[1]});if(!col)return entries();return h[2]?editItem(col,decodeURIComponent(h[2])):listCollection(col)}
  if(h[0]==='f'){var c2=CFG.collections.find(function(c){return c.name===h[1]});var file=c2&&c2.files.find(function(f){return f.name===h[2]});if(file)return editSettingsFile(c2,file)}
  entries();
}
function needsGitHub(){
  if(SESSION.connected)return false;
  var live=/(^|\.)bpohive\.com$/.test(location.hostname);
  main.innerHTML='<h1>One-time setup</h1><div class="note">'+(live?'Content editing needs a one-time connection to the GitHub account that stores the website. Click below while signed into GitHub as amresmat. After this, the admin password is all anyone needs.':'Content editing needs a one-time GitHub connection, which can only be done on www.bpohive.com/admin.')+'</div><a class="btn pri" href="'+(live?'/api/cms/auth?connect=1':'https://www.bpohive.com/admin/')+'">'+(live?'Connect GitHub':'Open www.bpohive.com/admin')+'</a>';
  return true;
}

/* ---------- Content lists ---------- */
function slugify(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'item'}
function titleOf(col,d){var k=col.identifier_field||'title';return d[k]||d.name||d.title||'(untitled)'}
function listCollection(col){
  if(needsGitHub())return;
  main.innerHTML='<h1>'+esc(col.label)+'</h1><p class="sub">'+esc(col.description||'')+'</p><div class="bar"><input id="q" type="search" placeholder="Search">'+(col.create?'<a class="btn pri" href="#c/'+col.name+'/new">New '+esc(col.label_singular||'item')+'</a>':'')+'</div><div class="card list" id="items"><div class="empty">Loading…</div></div>';
  listFolder(col.folder).then(function(files){
    return Promise.all(files.map(function(f){return readFile(col.folder+'/'+f.name).then(function(x){return{slug:f.name.replace(/\.json$/,''),data:x.data}}).catch(function(){return{slug:f.name.replace(/\.json$/,''),data:{}}})}));
  }).then(function(items){
    items.sort(function(a,b){return(a.data.order==null?1e9:a.data.order)-(b.data.order==null?1e9:b.data.order)||String(b.data.date||'').localeCompare(String(a.data.date||''))||String(titleOf(col,a.data)).localeCompare(titleOf(col,b.data))});
    function draw(){var q=($('q').value||'').toLowerCase();var rows=items.filter(function(i){return!q||JSON.stringify(i.data).toLowerCase().indexOf(q)>-1});
      $('items').innerHTML=rows.length?rows.map(function(i){var d=i.data,extra=col.name==='jobs'?(d.open===false?'<span class="tag off">Hidden</span>':'<span class="tag">Open</span>'):'';return'<div class="item" data-s="'+esc(i.slug)+'"><b>'+esc(titleOf(col,d))+'</b>'+(d.title&&col.identifier_field==='name'?'<span style="color:#5d7280">'+esc(d.title)+'</span>':'')+extra+'<small>'+esc(d.date||'')+'</small></div>'}).join(''):'<div class="empty">Nothing here yet.</div>';
      [].forEach.call($('items').querySelectorAll('.item'),function(el){el.onclick=function(){location.hash='#c/'+col.name+'/'+encodeURIComponent(el.dataset.s)}})}
    $('q').oninput=draw;draw();
  }).catch(function(e){$('items').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
}

/* ---------- Form builder ---------- */
function req(f){return f.required!==false}
function defaultsFor(fields){var o={};fields.forEach(function(f){if(f.default!==undefined)o[f.name]=f.default;else if(f.widget==='boolean')o[f.name]=false;else if(f.widget==='list')o[f.name]=[]});return o}
function fieldHTML(f,val,path){
  var id='f_'+path.replace(/[^a-z0-9_]/gi,'_'),w=f.widget||'string',hint=f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'',lab='<label for="'+id+'">'+esc(f.label||f.name)+(req(f)?'':' <span style="color:#8ea4b3;font-weight:500">(optional)</span>')+'</label>';
  if(val==null)val='';
  if(w==='boolean')return'<div class="f" data-path="'+path+'" data-w="boolean"><label class="chk"><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'> '+esc(f.label||f.name)+'</label>'+hint+'</div>';
  if(w==='text'||w==='markdown')return'<div class="f" data-path="'+path+'" data-w="'+w+'">'+lab+'<textarea id="'+id+'"'+(w==='markdown'?' class="md"':'')+'>'+esc(val)+'</textarea>'+(w==='markdown'?'<div class="hint">Markdown: ## for headings, **bold**, - for bullet points, [text](link) for links.</div>':'')+hint+'</div>';
  if(w==='number')return'<div class="f" data-path="'+path+'" data-w="number" data-vt="'+(f.value_type||'int')+'">'+lab+'<input type="number" id="'+id+'" step="'+(f.step||(f.value_type==='float'?'any':1))+'" value="'+esc(val)+'">'+hint+'</div>';
  if(w==='datetime')return'<div class="f" data-path="'+path+'" data-w="datetime">'+lab+'<input type="date" id="'+id+'" value="'+esc(String(val).slice(0,10))+'">'+hint+'</div>';
  if(w==='select'){var opts=(f.options||[]).map(function(o){var v=typeof o==='object'?o.value:o,l=typeof o==='object'?o.label:o;return'<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>'}).join('');return'<div class="f" data-path="'+path+'" data-w="select">'+lab+'<select id="'+id+'">'+(req(f)?'':'<option value=""></option>')+opts+'</select>'+hint+'</div>'}
  if(w==='image')return'<div class="f" data-path="'+path+'" data-w="image">'+lab+'<div class="img"><img alt="" src="'+esc(val||'')+'"'+(val?'':' hidden')+'><input type="text" id="'+id+'" value="'+esc(val)+'" placeholder="/assets/uploads/photo.jpg"><label class="btn">Upload<input type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden></label></div>'+hint+'</div>';
  if(w==='list'&&f.fields){var items=Array.isArray(val)?val:[];return'<div class="f" data-path="'+path+'" data-w="list">'+lab+hint+'<div class="items">'+items.map(function(it,i){return groupHTML(f,it,path,i,items.length)}).join('')+'</div><button type="button" class="mini add">+ Add '+esc(f.label_singular||'item')+'</button></div>'}
  return'<div class="f" data-path="'+path+'" data-w="string">'+lab+'<input type="text" id="'+id+'" value="'+esc(val)+'">'+hint+'</div>';
}
function groupHTML(f,it,path,i,n){var name=(it&&(it.name||it.title||it.quote||'')).toString().slice(0,60);return'<div class="group" data-i="'+i+'"><div class="gh"><span>'+esc(f.label_singular||'Item')+' '+(i+1)+(name?' · '+esc(name):'')+'</span><button type="button" class="mini up"'+(i?'':' disabled')+'>↑</button><button type="button" class="mini down"'+(i<n-1?'':' disabled')+'>↓</button><button type="button" class="mini rm">Remove</button></div>'+f.fields.map(function(sf){return fieldHTML(sf,it?it[sf.name]:undefined,path+'.'+i+'.'+sf.name)}).join('')+'</div>'}
function renderForm(box,fields,data){
  box.innerHTML=fields.map(function(f){return fieldHTML(f,data[f.name],f.name)}).join('');
  wire(box,fields,data);
}
function wire(box,fields,data){
  [].forEach.call(box.querySelectorAll('.f[data-w=image]'),function(el){var inp=el.querySelector('input[type=text]'),img=el.querySelector('img'),file=el.querySelector('input[type=file]');
    inp.oninput=function(){img.src=inp.value;img.hidden=!inp.value};
    file.onchange=function(){var fl=file.files[0];if(!fl)return;if(fl.size>3.5*1024*1024){alert('Please use an image under 3.5 MB.');return}
      var r=new FileReader();r.onload=function(){var b64=String(r.result).split(',')[1],ext=(fl.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z]/g,''),name=Date.now()+'-'+slugify(fl.name.replace(/\.[^.]+$/,''))+'.'+(ext==='jpeg'?'jpg':ext),path=(CFG.media_folder||'assets/uploads')+'/'+name;
        inp.disabled=true;gh('/contents/'+path,{method:'PUT',body:{message:'Admin: upload '+name,content:b64,branch:BRANCH}}).then(function(){inp.value=(CFG.public_folder||'/assets/uploads')+'/'+name;inp.oninput()}).catch(function(e){alert(e.message)}).then(function(){inp.disabled=false})};r.readAsDataURL(fl)}});
  [].forEach.call(box.querySelectorAll('.f[data-w=list]'),function(el){
    var path=el.dataset.path,f=findField(fields,path);if(!f)return;
    function current(){return collect(box,fields)}
    function redraw(arr){var d=current();setPath(d,path,arr);renderForm(box,fields,d)}
    el.querySelector(':scope>.add').onclick=function(){var arr=getPath(current(),path)||[];if(f.max&&arr.length>=f.max)return alert('Up to '+f.max+' allowed.');arr.push(defaultsFor(f.fields));redraw(arr)};
    [].forEach.call(el.querySelectorAll(':scope>.items>.group'),function(g){var i=+g.dataset.i;
      g.querySelector('.rm').onclick=function(){var arr=getPath(current(),path)||[];if(f.min&&arr.length<=f.min)return alert('At least '+f.min+' required.');if(!confirm('Remove this '+(f.label_singular||'item')+'?'))return;arr.splice(i,1);redraw(arr)};
      g.querySelector('.up').onclick=function(){var arr=getPath(current(),path);arr.splice(i-1,0,arr.splice(i,1)[0]);redraw(arr)};
      g.querySelector('.down').onclick=function(){var arr=getPath(current(),path);arr.splice(i+1,0,arr.splice(i,1)[0]);redraw(arr)};
    });
  });
}
function findField(fields,path){var parts=path.split('.'),f=null,list=fields;for(var i=0;i<parts.length;i++){if(/^\d+$/.test(parts[i]))continue;f=(list||[]).find(function(x){return x.name===parts[i]});if(!f)return null;list=f.fields}return f}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function setPath(o,p,v){var ks=p.split('.'),a=o;for(var i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function collect(box,fields){
  var out={};
  [].forEach.call(box.querySelectorAll('.f'),function(el){var w=el.dataset.w,p=el.dataset.path,v;if(w==='list'){if(getPath(out,p)==null)setPath(out,p,[]);return}
    var inp=el.querySelector(w==='boolean'?'input[type=checkbox]':w==='image'?'input[type=text]':'input,textarea,select');
    if(w==='boolean')v=inp.checked;else if(w==='number'){v=inp.value===''?'':(el.dataset.vt==='float'?parseFloat(inp.value):parseInt(inp.value,10))}else if(w==='select'){var f=findField(fields,p),o=(f.options||[]).find(function(x){return String(typeof x==='object'?x.value:x)===inp.value});v=o==null?inp.value:(typeof o==='object'?o.value:o)}else v=inp.value;
    setPath(out,p,v)});
  return out;
}
function clean(data,fields){fields.forEach(function(f){var v=data[f.name];if(f.widget==='list'&&f.fields&&Array.isArray(v))v.forEach(function(it){clean(it,f.fields)});if((v===''||v==null)&&!req(f))delete data[f.name]});return data}
function validate(box,fields,data){
  var ok=true;[].forEach.call(box.querySelectorAll('.f'),function(el){el.classList.remove('bad');var e=el.querySelector(':scope>.err');if(e)e.remove()});
  [].forEach.call(box.querySelectorAll('.f'),function(el){var f=findField(fields,el.dataset.path);if(!f||f.widget==='boolean'||f.widget==='list')return;var v=getPath(data,el.dataset.path),msg='';
    if(req(f)&&(v===''||v==null||(typeof v==='number'&&isNaN(v))))msg='Required';
    else if(f.pattern&&v&&!(new RegExp(f.pattern[0])).test(String(v)))msg=f.pattern[1];
    if(msg){ok=false;el.classList.add('bad');el.insertAdjacentHTML('beforeend','<div class="err">'+esc(msg)+'</div>')}});
  if(!ok){var b=box.querySelector('.f.bad');if(b)b.scrollIntoView({behavior:'smooth',block:'center'})}
  return ok;
}
function merge(orig,next,fields){var out=Object.assign({},orig);fields.forEach(function(f){delete out[f.name]});fields.forEach(function(f){if(next[f.name]!==undefined)out[f.name]=next[f.name]});return out}

/* ---------- Edit a collection item ---------- */
function editItem(col,slug){
  if(needsGitHub())return;
  var isNew=slug==='new',path=col.folder+'/'+slug+'.json',sha=null,orig={};
  main.innerHTML='<p><a href="#c/'+col.name+'">← '+esc(col.label)+'</a></p><h1>'+(isNew?'New '+esc(col.label_singular||'item'):'Edit')+'</h1><p class="sub">'+esc(col.description||'')+'</p><div class="card form"><div id="fields"><div class="empty">Loading…</div></div><div class="actions"><button class="btn pri" id="save" type="button">'+(isNew?'Publish':'Save and publish')+'</button>'+(!isNew&&col.delete!==false?'<button class="btn del" id="del" type="button">Delete</button>':'')+(!isNew&&col.preview_path?'<a class="btn" target="_blank" rel="noopener" href="/'+esc(col.preview_path.replace('{{slug}}',slug))+'">View on site ↗</a>':'')+'<span class="msg" id="msg"></span></div></div>';
  var box=$('fields');
  (isNew?Promise.resolve({data:defaultsFor(col.fields)}):readFile(path)).then(function(x){sha=x.sha;orig=x.data;renderForm(box,col.fields,orig)}).catch(function(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
  $('save').onclick=function(){
    var data=clean(collect(box,col.fields),col.fields);if(!validate(box,col.fields,data))return;
    var out=merge(orig,data,col.fields),target=path,btn=this;
    var p=Promise.resolve();
    if(isNew){var base=slugify(titleOf(col,out));p=listFolder(col.folder).then(function(files){var names=files.map(function(f){return f.name}),s=base,n=2;while(names.indexOf(s+'.json')>-1)s=base+'-'+n++;target=col.folder+'/'+s+'.json';slug=s})}
    btn.disabled=true;$('msg').textContent='Saving…';
    p.then(function(){return writeFile(target,out,sha,'Admin: '+(isNew?'create':'update')+' '+(col.label_singular||col.name)+' “'+titleOf(col,out)+'”')}).then(function(j){sha=j.content&&j.content.sha;orig=out;$('msg').textContent='Saved. Live on the site in about a minute.';if(isNew){isNew=false;history.replaceState(null,'','#c/'+col.name+'/'+encodeURIComponent(slug));editItem(col,slug)}}).catch(function(e){$('msg').textContent='';alert('Could not save: '+e.message)}).then(function(){btn.disabled=false});
  };
  if($('del'))$('del').onclick=function(){if(!confirm('Delete “'+titleOf(col,orig)+'” from the website? This cannot be undone here.'))return;this.disabled=true;removeFile(path,sha,'Admin: delete '+(col.label_singular||col.name)+' “'+titleOf(col,orig)+'”').then(function(){location.hash='#c/'+col.name}).catch(function(e){alert('Could not delete: '+e.message)})};
}

/* ---------- Edit a settings file ---------- */
function editSettingsFile(col,file){
  if(needsGitHub())return;
  var sha=null,orig={};
  main.innerHTML='<h1>'+esc(file.label||file.name)+'</h1><p class="sub">'+esc(col.label)+'</p><div class="card form"><div id="fields"><div class="empty">Loading…</div></div><div class="actions"><button class="btn pri" id="save" type="button">Save and publish</button><span class="msg" id="msg"></span></div></div>';
  var box=$('fields');
  readFile(file.file).then(function(x){sha=x.sha;orig=x.data;renderForm(box,file.fields,orig)}).catch(function(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
  $('save').onclick=function(){var data=clean(collect(box,file.fields),file.fields);if(!validate(box,file.fields,data))return;var out=merge(orig,data,file.fields),btn=this;btn.disabled=true;$('msg').textContent='Saving…';
    writeFile(file.file,out,sha,'Admin: update '+(file.label||file.name)).then(function(j){sha=j.content&&j.content.sha;orig=out;$('msg').textContent='Saved. Live on the site in about a minute.'}).catch(function(e){$('msg').textContent='';alert('Could not save: '+e.message)}).then(function(){btn.disabled=false})};
}

/* ---------- Form entries ---------- */
var ED={entries:[],abandoned:[]},EV='entries';
function pick(f,keys){for(var i=0;i<keys.length;i++){if(f[keys[i]])return f[keys[i]]}return''}
function nameOf(f){return pick(f,['name','fullName'])||[pick(f,['firstName','first_name','fname']),pick(f,['lastName','last_name','lname'])].join(' ').trim()}
function when(r){return new Date(r.at||r.updated||r.first)}
function fmt(d){return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function entries(){
  main.innerHTML='<h1>Form entries</h1><p class="sub">Every form sent from the website, plus forms people started but never sent.</p><div class="tabs"><button class="tab" data-v="entries" type="button">Form entries <b id="n-entries">0</b></button><button class="tab" data-v="abandoned" type="button">Abandoned forms <b id="n-abandoned">0</b></button></div><div class="bar"><input id="eq" type="search" placeholder="Search name, email, company, phone"><select id="ef"><option value="">All forms</option></select><button class="btn" id="csv" type="button">Download CSV</button><button class="btn" id="refresh" type="button">Refresh</button></div><div class="card tablewrap"><table><thead><tr><th>Date</th><th>Form</th><th>Name</th><th>Email</th><th>Company</th><th>Phone</th><th>Budget</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="eempty">Loading…</div></div>';
  [].forEach.call(main.querySelectorAll('.tab'),function(t){t.onclick=function(){EV=t.dataset.v;$('ef').value='';drawEntries()}});
  $('eq').oninput=drawEntries;$('ef').onchange=drawEntries;$('csv').onclick=csv;$('refresh').onclick=loadEntries;
  loadEntries();
}
function loadEntries(){
  Promise.all(['entries','abandoned'].map(function(v){return fetch('/api/admin/entries?view='+v,{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j}})})})).then(function(res){
    if(res[0].status===401)return showLogin();
    if(!res[0].ok){ED={entries:[],abandoned:[]};drawEntries();$('eempty').textContent=res[0].j.error||'Could not load entries.';$('eempty').hidden=false;return}
    ED.entries=res[0].j.rows||[];ED.abandoned=res[1].ok?(res[1].j.rows||[]):[];drawEntries();
  });
}
function entryRows(){var q=($('eq').value||'').trim().toLowerCase(),ff=$('ef').value;return ED[EV].filter(function(r){return(!ff||r.form===ff)&&(!q||JSON.stringify(r.fields).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return when(b)-when(a)})}
function drawEntries(){
  if(!$('rows'))return;
  [].forEach.call(main.querySelectorAll('.tab'),function(t){t.classList.toggle('on',t.dataset.v===EV)});
  var list=entryRows(),forms={};ED[EV].forEach(function(r){forms[r.form]=1});
  var sel=$('ef'),cur=sel.value;sel.innerHTML='<option value="">All forms</option>'+Object.keys(forms).sort().map(function(f){return'<option'+(f===cur?' selected':'')+'>'+esc(f)+'</option>'}).join('');
  $('rows').innerHTML=list.map(function(r,i){var f=r.fields||{};return'<tr data-i="'+i+'"><td>'+esc(fmt(when(r)))+'</td><td><span class="tag">'+esc(r.form)+'</span></td><td>'+esc(nameOf(f))+'</td><td>'+esc(pick(f,['email','work_email','businessEmail']))+'</td><td>'+esc(pick(f,['company','companyName','company_name','website']))+'</td><td>'+esc(pick(f,['phone','phone_number','tel']))+'</td><td>'+esc(pick(f,['budget','monthly_budget']))+'</td></tr>'}).join('');
  $('eempty').hidden=list.length>0;$('eempty').textContent='Nothing here yet.';
  $('n-entries').textContent=ED.entries.length;$('n-abandoned').textContent=ED.abandoned.length;
  [].forEach.call($('rows').children,function(tr){tr.onclick=function(){showEntry(list[+tr.dataset.i])}});
}
function showEntry(r){
  var f=r.fields||{};$('d-title').textContent=nameOf(f)||pick(f,['email'])||'Entry';
  $('d-sub').textContent=r.form+' · '+fmt(when(r))+(EV==='abandoned'?' · last typed':'');
  var extra={Page:r.page,Referrer:r.referrer};if(EV==='abandoned'&&r.first)extra.Started=fmt(new Date(r.first));
  $('d-body').innerHTML=Object.keys(f).map(function(k){return'<dt>'+esc(k)+'</dt><dd>'+esc(f[k])+'</dd>'}).join('')+Object.keys(extra).filter(function(k){return extra[k]}).map(function(k){return'<dt>'+k+'</dt><dd>'+esc(extra[k])+'</dd>'}).join('');
  $('d-del').onclick=function(){if(!r.id||!confirm('Delete this entry for good? This cannot be undone.'))return;fetch('/api/admin/entries?view='+EV+'&id='+encodeURIComponent(r.id),{method:'DELETE',credentials:'same-origin'}).then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error(j.error||'Could not delete.')})}).then(function(){$('detail').close();ED[EV]=ED[EV].filter(function(y){return y!==r});drawEntries()}).catch(function(e){alert(e.message)})};
  $('detail').showModal();
}
function csv(){
  var list=entryRows(),keys={};list.forEach(function(r){Object.keys(r.fields||{}).forEach(function(k){keys[k]=1})});
  var cols=Object.keys(keys),q=function(v){v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var lines=[['date','form'].concat(cols,['page']).map(q).join(',')].concat(list.map(function(r){return[when(r).toISOString(),r.form].concat(cols.map(function(k){return(r.fields||{})[k]}),[r.page]).map(q).join(',')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='bpohive-'+EV+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

/* ---------- Sign-in ---------- */
function showLogin(){$('app').hidden=true;$('login').hidden=false;var p=$('login-form').password;if(p)p.focus()}
var INVITE=new URLSearchParams(location.search).get('invite');
function showInvite(){
  $('app').hidden=true;$('login').hidden=false;$('login-form').hidden=true;$('invite-form').hidden=false;
  fetch('/api/admin/login?invite='+encodeURIComponent(INVITE),{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'This invite link does not work.');return j})}).then(function(j){$('inv-name').textContent=', '+j.name;$('inv-email').textContent=j.email;$('invite-form').password.focus()}).catch(function(e){$('invite-err').textContent=e.message;$('invite-form').querySelector('button').disabled=true});
}
$('invite-form').onsubmit=function(e){e.preventDefault();var f=this;$('invite-err').textContent='';
  if(f.password.value!==f.password2.value){$('invite-err').textContent='The two passwords are not the same.';return}
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({invite:INVITE,password:f.password.value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not save the password')})}).then(function(){INVITE=null;history.replaceState(null,'','/admin/#pipeline');f.reset();$('invite-form').hidden=true;$('login-form').hidden=false;start()}).catch(function(e){$('invite-err').textContent=e.message})};
function start(){
  if(INVITE)return showInvite();
  fetch('/api/admin/session',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json()}).then(function(s){
    SESSION=s;if(!s.signedIn)return showLogin();
    if(s.role==='caller'){CFG={collections:[]};$('who').hidden=false;$('who').textContent=s.name;$('login').hidden=true;$('app').hidden=false;buildNav();route();return}
    return fetch('/admin/config.yml',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){CFG=c;$('login').hidden=true;$('app').hidden=false;buildNav();route()});
  }).catch(function(){main.innerHTML='<div class="empty">Could not load the admin. Refresh to try again.</div>';$('app').hidden=false});
}
$('login-form').onsubmit=function(e){e.preventDefault();$('login-err').textContent='';
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:/@/.test(this.email.value)?this.email.value.trim():'',password:this.password.value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Sign in failed')})}).then(function(){$('login-form').reset();start()}).catch(function(e){$('login-err').textContent=e.message})};
$('logout').onclick=function(){fetch('/api/admin/login',{method:'DELETE',credentials:'same-origin'}).then(function(){location.reload()})};
$('menu').onclick=function(){$('side').classList.toggle('open')};
document.querySelector('#detail .x').onclick=function(){$('detail').close()};
window.addEventListener('hashchange',function(){if(CFG)route()});
start();
})();
</script>
