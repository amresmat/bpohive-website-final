<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BPO Hive Content Manager</title><link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
<style>#bh-gate{position:fixed;inset:0;display:grid;place-items:center;background:#f5f9fc;font:15px/1.5 Inter,"Helvetica Neue",Arial,sans-serif;color:#0d1d2b;z-index:10000}#bh-gate .box{width:min(380px,calc(100% - 32px));padding:28px;border:1px solid #dbe8f0;border-radius:12px;background:#fff;text-align:center}#bh-gate img{height:32px;margin-bottom:14px}#bh-gate p{color:#5d7280}#bh-gate a{display:inline-flex;align-items:center;justify-content:center;height:46px;margin-top:8px;padding:0 20px;border-radius:6px;background:#0f7ac4;color:#fff;font-weight:600;text-decoration:none}</style>
</head><body>
<div id="bh-gate"><div class="box"><img src="/assets/logo/bpohivelogo.png" alt="BPO Hive"><p id="bh-msg">Loading…</p><a id="bh-act" href="#" hidden></a></div></div>
<a href="/admin/entries.html" style="position:fixed;right:18px;bottom:18px;z-index:10001;padding:10px 16px;border-radius:6px;background:#0f7ac4;color:#fff;font:600 14px/1 Inter,Arial,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(8,21,33,.25)">Form entries</a>
<script>
// Signs editors in with the shared admin password. GitHub works behind the scenes, so the
// content editor opens straight away without its own GitHub sign-in screen.
(function(){
  var gate=document.getElementById('bh-gate'),msg=document.getElementById('bh-msg'),act=document.getElementById('bh-act');
  function show(text,label,href){msg.textContent=text;if(label){act.textContent=label;act.href=href;act.hidden=false}}
  fetch('/api/admin/session',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json()}).then(function(s){
    if(!s.signedIn){location.replace('/admin/entries.html?next=/admin/');return}
    if(!s.connected){
      var live=/(^|\.)bpohive\.com$/.test(location.hostname);
      show(live?'One-time setup: connect the GitHub account that owns the website code. After this, the admin password is all anyone needs.':'The content editor needs a one-time GitHub connection, which can only be done on www.bpohive.com/admin.',live?'Connect GitHub':'Open www.bpohive.com/admin',live?'/api/cms/auth?connect=1':'https://www.bpohive.com/admin/');
      return;
    }
    try{localStorage.setItem('decap-cms-user',JSON.stringify({backendName:'github',token:'session'}))}catch(e){}
    var sc=document.createElement('script');sc.src='https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js';sc.onload=function(){gate.remove()};document.body.appendChild(sc);
  }).catch(function(){show('Could not reach the admin. Refresh to try again.')});
})();
</script>
</body></html>
